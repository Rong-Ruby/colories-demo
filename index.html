<body>

<div class="top-bar">
  <h1>📱 卡路里识别 · 体验 Demo</h1>
  <p>完整走一遍识别 → 记录 → 查看的流程</p>
  <span class="tip-pill">👇 点"开始识别"即可体验</span>
  <button class="reset-btn" onclick="resetAll()">重置数据</button>
</div>

<div class="phone">
  <div class="screen">

    <!-- 状态栏 -->
    <div class="status-bar">
      <span>9:41</span>
      <span class="icons">●●●●● 100%</span>
    </div>

    <!-- 页面容器 -->
    <div class="page active" id="page-scan">
      <div class="nav-bar">识别卡路里</div>
      <div class="content">
        <div class="scan-header">
          <span class="title">识别卡路里</span>
          <span class="subtitle">拍一拍食物，快速知道它的热量</span>
        </div>
        <div class="scan-area" id="scanArea">
          <div class="scan-icon"><span>📷</span></div>
          <div class="scan-hint" id="scanHint">将食物对准识别框</div>
        </div>
        <label for="fileInput" class="btn-scan" id="btnScan" style="display:flex;align-items:center;justify-content:center;">开始识别</label>
        <div class="today-card">
          <span class="label">今日已记录</span>
          <span class="value" id="todayVal">0<span class="unit">kcal</span></span>
        </div>
      </div>
    </div>

    <div class="page" id="page-record">
      <div class="nav-bar">摄入记录</div>
      <div class="content">
        <div class="goal-card">
          <div class="goal-row">
            <div class="goal-cell">
              <span class="goal-label">今日摄入</span>
              <span class="goal-value big" id="goalToday">0</span>
            </div>
            <div class="goal-divider"></div>
            <div class="goal-cell">
              <span class="goal-label">每日目标</span>
              <span class="goal-value">
                <span class="goal-edit" onclick="editGoal()"><span id="goalNum">1500</span> <span class="pencil">✎</span></span>
              </span>
            </div>
          </div>
          <div class="goal-sub" id="goalSub">还剩 1500 kcal</div>
        </div>

        <div class="section">
          <div class="section-title">今日记录</div>
          <div id="recordList"><div class="empty">今日暂无记录，快去识别吧～</div></div>
        </div>

        <div class="section">
          <div class="section-title">本周总结</div>
          <div class="week-grid" id="weekGrid"></div>
          <div class="week-avg" id="weekAvg">日均：0 kcal</div>
        </div>
      </div>
    </div>

    <!-- TabBar -->
    <div class="tab-bar">
      <div class="tab-item active" data-tab="scan" onclick="switchTab('scan')">
        <span class="tab-icon">🔍</span><span>识别</span>
      </div>
      <div class="tab-item" data-tab="record" onclick="switchTab('record')">
        <span class="tab-icon">📋</span><span>记录</span>
      </div>
    </div>

    <!-- Home Indicator -->
    <div class="home-indicator"></div>

    <!-- ========== 摄像头全屏层 ========== -->
    <div class="camera-wrap" id="cameraWrap">
      <video class="camera-video" id="cameraVideo" autoplay playsinline muted></video>
      <div class="camera-top">
        <button class="camera-close" onclick="closeCamera()">✕</button>
        <span class="camera-tip">对准食物 → 点下方快门拍照</span>
        <span style="width:34px"></span>
      </div>
      <div class="camera-bottom">
        <div class="shutter" id="shutter" onclick="takePhoto()"></div>
      </div>
      <div class="camera-error" id="cameraError" style="display:none"></div>
    </div>

    <!-- 拍照后预览层 -->
    <div class="preview-wrap" id="previewWrap">
      <img class="preview-img" id="previewImg" alt="拍摄预览">
      <div class="preview-actions">
        <button class="preview-btn retake" onclick="retakePhoto()">重拍</button>
        <button class="preview-btn use" onclick="analyzePhoto()">识别卡路里</button>
      </div>
    </div>

    <!-- 隐藏的 canvas 用于拍照 -->
    <canvas id="photoCanvas" style="display:none"></canvas>

    <!-- 拍照 input（用 position:absolute 隐藏比 display:none 更稳，某些浏览器对后者 label 联动不触发）-->
    <input type="file" id="fileInput" accept="image/*" capture="environment"
           onchange="handleFile(this)"
           style="position:absolute;opacity:0;width:1px;height:1px;pointer-events:none;">

    <!-- 识别结果弹窗 -->
    <div class="modal-mask" id="modal">
      <div class="modal">
        <div class="m-title">识别结果</div>
        <div class="m-row">
          <span class="m-label">食物</span>
          <span class="m-value" id="mFood">—</span>
        </div>
        <div class="m-row">
          <span class="m-label">卡路里</span>
          <span class="m-calorie"><span id="mCal">—</span><span class="unit">kcal</span></span>
        </div>
        <div class="m-actions">
          <button class="m-btn cancel" onclick="closeModal()">取消</button>
          <button class="m-btn record" onclick="confirmRecord()">记录</button>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">已记录 ✓</div>

  </div>
</div>

<script>
  // ===== 食物库（USDA FoodData Central 数据）=====
  // cocoLabel → TensorFlow COCO-SSD 可识别的英文类别
  // color → 该食物的代表主色调（十六进制），用于 COCO 未命中时的颜色匹配
  const FOODS = [
    { name: '苹果',     cal: 95,  cocoLabel: 'apple',      color: '#E8411E' },
    { name: '香蕉',     cal: 105, cocoLabel: 'banana',     color: '#FFD93D' },
    { name: '橙子',     cal: 45,  cocoLabel: 'orange',     color: '#F07F1E' },
    { name: '西兰花',   cal: 34,  cocoLabel: 'broccoli',   color: '#3B7A24' },
    { name: '胡萝卜',   cal: 41,  cocoLabel: 'carrot',     color: '#FF6B35' },
    { name: '热狗',     cal: 290, cocoLabel: 'hot dog',    color: '#D2691E' },
    { name: '披萨',     cal: 285, cocoLabel: 'pizza',      color: '#D2691E' },
    { name: '蛋糕',     cal: 250, cocoLabel: 'cake',       color: '#F5DEB3' },
    { name: '甜甜圈',   cal: 350, cocoLabel: 'donut',      color: '#DEB887' },
    { name: '三明治',   cal: 320, cocoLabel: 'sandwich',   color: '#D2B48C' },
    { name: '草莓',     cal: 32,                        color: '#E53935' },
    { name: '葡萄',     cal: 86,                        color: '#6A0DAD' },
    { name: '西瓜',     cal: 46,                        color: '#FF4D4F' },
    { name: '米饭',     cal: 205,                       color: '#F5F5DC' },
    { name: '鸡蛋',     cal: 78,                        color: '#FFF8DC' },
    { name: '牛奶',     cal: 150,                       color: '#FAFAFA' },
    { name: '鸡胸肉',   cal: 165,                       color: '#F5E6D3' },
    { name: '三文鱼',   cal: 208,                       color: '#FF8C69' },
    { name: '土豆',     cal: 145,                       color: '#D2B48C' },
    { name: '番茄',     cal: 22,                        color: '#E53935' },
    { name: '黄瓜',     cal: 16,                        color: '#78C850' },
    { name: '全麦面包', cal: 81,                        color: '#A0522D' },
    { name: '燕麦粥',   cal: 166,                       color: '#F0E68C' },
  ];

  // COCO-SSD 食物类白名单
  const COCO_FOODS = new Set(['apple','banana','orange','broccoli','carrot','hot dog','pizza','donut','cake','sandwich']);

  // ===== 状态 =====
  let state = {
    goal: 1500,
    records: [],  // { name, cal, time }
    pendingScan: null
  };

  // ===== 识别后端 API 接入点（保留接口，留空=用本地 TF.js 识别）=====
  // 接真实后端时填：'https://your-api.com/food/recognize'
  // 后端需接收 POST { image: base64 }，返回 { name: '苹果', cal: 95 }
  const RECOGNIZE_API = '';

  // 初始化：给点 mock 历史数据让记录页不空
  function initMockData() {
    const today = new Date();
    const dayNames = ['周日','周一','周二','周三','周四','周五','周六'];
    state.weekData = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      let total = 0;
      if (i > 0) total = Math.round(900 + Math.random() * 700);
      state.weekData.push({ day: dayNames[d.getDay()], total, isToday: i === 0 });
    }
  }

  // ===== 页面切换 =====
  function switchTab(tab) {
    document.querySelectorAll('.tab-item').forEach(t => {
      t.classList.toggle('active', t.dataset.tab === tab);
    });
    document.getElementById('page-scan').classList.toggle('active', tab === 'scan');
    document.getElementById('page-record').classList.toggle('active', tab === 'record');
    if (tab === 'record') renderRecordPage();
  }

  // ===== 拍照处理（唯一入口：label → input change）=====
  function handleFile(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      document.getElementById('previewImg').src = ev.target.result;
      // 关掉可能存在的 camera 层
      var cw = document.getElementById('cameraWrap');
      if (cw) cw.classList.remove('show');
      // 显示预览
      document.getElementById('previewWrap').classList.add('show');
    };
    reader.onerror = function() { showToast('图片读取失败'); };
    reader.readAsDataURL(file);
    // 清空 input 让下次能重选同一张
    input.value = '';
  }

  function retakePhoto() {
    document.getElementById('previewWrap').classList.remove('show');
    document.getElementById('fileInput').click();
  }

  function closeCamera() {
    document.getElementById('cameraWrap').classList.remove('show');
  }

  // ===== TensorFlow.js + COCO-SSD 初始化 =====
  let tfModel = null;
  let tfLoading = false;
  async function ensureModel() {
    if (tfModel) return true;
    if (tfLoading) return false;
    if (!window.tf || !window.cocoSsd) {
      showToast('AI 引擎未加载，请检查网络');
      return false;
    }
    tfLoading = true;
    showToast('加载识别模型中（首次约 10MB）...');
    try {
      tfModel = await cocoSsd.load({ base: 'mobilenet_v2' });
      showToast('模型就绪 ✓');
      return true;
    } catch (e) {
      console.error('模型加载失败', e);
      showToast('模型加载失败');
      return false;
    } finally {
      tfLoading = false;
    }
  }

  // ===== 颜色特征辅助识别（COCO 未命中时的降级方案）=====
  function parseHex(h) { return [parseInt(h.substr(1,2),16), parseInt(h.substr(3,2),16), parseInt(h.substr(5,2),16)]; }
  function colorDist(a, b) {
    var dr = a[0]-b[0], dg = a[1]-b[1], db = a[2]-b[2];
    return Math.sqrt(dr*dr + dg*dg + db*db);
  }
  /** 用 canvas 提取图片主色调（跳过透明/纯白/纯黑像素） */
  function dominantColor(img) {
    var W = 40, H = 40;
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var ctx = c.getContext('2d');
    try { ctx.drawImage(img, 0, 0, W, H); } catch (e) { return null; }
    var data;
    try { data = ctx.getImageData(0, 0, W, H).data; } catch (e) { return null; }
    var buckets = {};
    for (var i = 0; i < data.length; i += 4) {
      var r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
      if (a < 128) continue;
      if (r > 230 && g > 230 && b > 230) continue;
      if (r < 20 && g < 20 && b < 20) continue;
      if (Math.abs(r-g) < 10 && Math.abs(g-b) < 10 && Math.abs(r-b) < 10) continue;
      var key = (r>>3) + ',' + (g>>3) + ',' + (b>>3);
      buckets[key] = (buckets[key] || 0) + 1;
    }
    var max = 0, best = null;
    for (var k in buckets) { if (buckets[k] > max) { max = buckets[k]; best = k; } }
    if (!best) return null;
    var parts = best.split(',');
    return [(parseInt(parts[0])<<3)+4, (parseInt(parts[1])<<3)+4, (parseInt(parts[2])<<3)+4];
  }
  /** 用颜色匹配食物库，返回相似度最高的 */
  function matchByColor(img) {
    var dc = dominantColor(img);
    if (!dc) return null;
    var bestFood = null, bestDist = Infinity;
    for (var i = 0; i < FOODS.length; i++) {
      var f = FOODS[i];
      if (!f.color) continue;
      var d = colorDist(dc, parseHex(f.color));
      if (d < bestDist) { bestDist = d; bestFood = f; }
    }
    return bestDist <= 90 ? bestFood : null;
  }

  /** 本地识别：优先 COCO-SSD，没命中降级颜色匹配。返回 { name, cal } 或 null */
  async function localRecognize(img) {
    if (await ensureModel()) {
      var predictions;
      try { predictions = await tfModel.detect(img, 10); }
      catch (e) { console.warn('COCO detect 失败', e); predictions = []; }
      var best = null;
      for (var i = 0; i < predictions.length; i++) {
        var p = predictions[i];
        if (COCO_FOODS.has(p.class) && p.score >= 0.4) {
          if (!best || p.score > best.score) best = p;
        }
      }
      if (best) {
        var matched = FOODS.find(function(f) { return f.cocoLabel === best.class; });
        if (matched) return { name: matched.name, cal: matched.cal, score: best.score };
      }
    }
    // 降级颜色匹配
    var colorMatch = matchByColor(img);
    if (colorMatch) return { name: colorMatch.name, cal: colorMatch.cal, score: null };
    return null;
  }

  /** 调用后端识别 API（POST { image: base64 } → { name, cal }） */
  async function apiRecognize(img) {
    showToast('调用后端识别接口...');
    // 把 <img> 转 base64
    var c = document.createElement('canvas');
    c.width = img.naturalWidth || 300;
    c.height = img.naturalHeight || 300;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    var base64 = c.toDataURL('image/jpeg', 0.7).split(',')[1];

    try {
      var res = await fetch(RECOGNIZE_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: base64 })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      if (data && data.name) return { name: data.name, cal: data.cal || 0, score: null };
      throw new Error('接口返回格式错误');
    } catch (e) {
      console.error('API 识别失败', e);
      showToast('后端识别失败，回退本地识别');
      return await localRecognize(img);  // API 失败 → 回退本地
    }
  }

  /** 统一识别入口：有 API 走 API，否则本地 TF.js */
  async function recognizeFood(img) {
    return RECOGNIZE_API ? await apiRecognize(img) : await localRecognize(img);
  }

  /** 拍照后点「识别卡路里」→ 调统一入口 → 弹窗 */
  async function analyzePhoto() {
    var img = document.getElementById('previewImg');
    if (!img.src || !img.naturalWidth) { showToast('请先拍一张照片'); return; }

    showToast('识别中...');
    var result = await recognizeFood(img);
    if (result) {
      state.pendingScan = { name: result.name, cal: result.cal };
      var label = result.name + (result.score ? ' (' + Math.round(result.score*100) + '% 置信)' : '');
      document.getElementById('mFood').textContent = label;
      document.getElementById('mCal').textContent = result.cal;
      document.getElementById('previewWrap').classList.remove('show');
      openModal();
      showToast('识别完成 ✓');
    } else {
      showToast('没识别出食物，请对准食物重拍');
    }
  }

  function openModal() { document.getElementById('modal').classList.add('show'); }
  function closeModal() { document.getElementById('modal').classList.remove('show'); }

  function confirmRecord() {
    if (!state.pendingScan) return;
    var now = new Date();
    var time = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    state.records.unshift({
      name: state.pendingScan.name,
      cal: state.pendingScan.cal,
      time
    });
    // 同步到本周数据（今天 +cal）
    const todayIdx = state.weekData.findIndex(d => d.isToday);
    if (todayIdx >= 0) state.weekData[todayIdx].total += state.pendingScan.cal;

    closeModal();
    updateScanToday();
    showToast('已记录 ✓');
    state.pendingScan = null;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1200);
  }

  function updateScanToday() {
    const total = state.records.reduce((s, r) => s + r.cal, 0);
    document.getElementById('todayVal').innerHTML = total + '<span class="unit">kcal</span>';
  }

  // ===== 记录页渲染 =====
  function renderRecordPage() {
    const total = state.records.reduce((s, r) => s + r.cal, 0);
    document.getElementById('goalToday').textContent = total;
    document.getElementById('goalNum').textContent = state.goal;
    const diff = state.goal - total;
    document.getElementById('goalSub').textContent = diff >= 0
      ? `还剩 ${diff} kcal`
      : `已超 ${-diff} kcal`;

    // 列表
    const list = document.getElementById('recordList');
    if (state.records.length === 0) {
      list.innerHTML = '<div class="empty">今日暂无记录，快去识别吧～</div>';
    } else {
      list.innerHTML = state.records.map(r => `
        <div class="record-item">
          <div class="record-left">
            <span class="food-name">${r.name}</span>
            <span class="food-time">${r.time}</span>
          </div>
          <span class="food-cal">${r.cal} kcal</span>
        </div>`).join('');
    }

    // 本周
    const grid = document.getElementById('weekGrid');
    grid.innerHTML = state.weekData.map(d => `
      <div class="week-cell ${d.isToday ? 'today' : ''}">
        <span class="week-day">${d.day}${d.isToday ? '（今天）' : ''}</span>
        <span class="week-total">${d.total}<span class="unit">kcal</span></span>
      </div>`).join('');
    const sum = state.weekData.reduce((s, d) => s + d.total, 0);
    document.getElementById('weekAvg').textContent = '日均：' + Math.round(sum / 7) + ' kcal';
  }

  function editGoal() {
    const val = prompt('设置每日目标 (kcal)', state.goal);
    if (val === null) return;
    const n = Number(val);
    if (!isFinite(n) || n <= 0) { alert('请输入有效数字'); return; }
    state.goal = Math.round(n);
    renderRecordPage();
    showToast('已更新 ✓');
  }

  function resetAll() {
    state.records = [];
    state.goal = 1500;
    initMockData();
    updateScanToday();
    renderRecordPage();
    showToast('已重置');
  }

  // ===== 启动 =====
  initMockData();
  updateScanToday();
</script>
